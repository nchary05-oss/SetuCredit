# SetuCredit on Render — one-click Blueprint.
#   Dashboard → "New" → "Blueprint" → pick this repo → Render reads render.yaml.
#
# Secrets marked `sync: false` are prompted at creation time. Demo deploys can
# flip ENV to `dev` in the dashboard to re-enable `dev_otp` in API responses —
# never ship that value to real borrowers.

databases: # Postgres — audit ledger + consent records only (no borrower PII)
  - name: setucredit-db
    databaseName: setucredit
    user: setucredit
    plan: free # free tier expires after 30 days; use `starter` for production

services:
  # Redis — OTP/session state, all keys TTL-bound
  - type: keyvalue
    name: setucredit-redis
    plan: free
    ipAllowList: [] # internal connections only
    maxmemoryPolicy: volatile-ttl # sessions/OTPs carry their own TTLs

  # BRI scoring microservice (backend-only caller, :8001)
  - type: web
    name: setucredit-scoring
    runtime: docker
    dockerfilePath: infra/docker/scoring.Dockerfile
    dockerContext: . # uv workspace root (pyproject.toml + uv.lock live here)
    plan: free
    healthCheckPath: /healthz
    envVars:
      - key: ENV
        value: production

  # FastAPI backend (migrations run in the container CMD, :8000)
  - type: web
    name: setucredit-backend
    runtime: docker
    dockerfilePath: infra/docker/backend.Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /healthz
    envVars:
      - key: ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: setucredit-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: setucredit-redis
          property: connectionString
      - key: SCORING_SERVICE_URL
        value: https://setucredit-scoring.onrender.com
      - key: WEBHOOK_SECRET
        generateValue: true # per-deploy HMAC secret; partners get it out of band
      - key: PARTNER_WEBHOOK_URL
        sync: false # unset = appraisal skips the NBFC push
      - key: ULI_CLIENT_ID
        sync: false
      - key: ULI_CLIENT_SECRET
        sync: false
      - key: UIDAI_API_KEY
        sync: false
      - key: SMS_API_KEY
        sync: false

  # React PWA — nginx proxies browser traffic so /v1 stays same-origin
  - type: web
    name: setucredit-web
    runtime: docker
    dockerfilePath: frontend/Dockerfile
    dockerContext: frontend
    plan: free
    healthCheckPath: / # SPA: any path serves index.html
    envVars:
      - key: BACKEND_URL
        value: https://setucredit-backend.onrender.com
